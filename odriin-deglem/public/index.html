<!doctype html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf7">
  <title>Өдрийн дэглэм · 51 дүгээр сургууль</title>
  <!-- Сонгосон theme-ийг хуудас зурагдахаас өмнө тохируулна (анивчихгүй) -->
  <script>
    try { if (localStorage.getItem("odriin-deglem.theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <noscript><p style="padding:24px">Энэ сайтыг ашиглахын тулд хөтчийнхөө JavaScript-ийг асаана уу.</p></noscript>
  </div>
  <!-- Supabase JS сан (хувилбарыг тогтоосон) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <!-- Холболтын тохиргоо: npm run config командаар .env.local-аас үүснэ. Зөвхөн нийтэд ил байх anon түлхүүр агуулна. -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
